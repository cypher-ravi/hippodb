[project]
name = "engram"
version = "0.0.1"
description = "A memory engine for AI agents: entities, linked facts with time and source, recall by association."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastembed>=0.4",
    "numpy>=1.26",
    "openai>=1.50",
    "tiktoken>=0.7",
]

[project.scripts]
engram-bench = "engram.bench.run:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
